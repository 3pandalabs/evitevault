# Local Postgres only. Production uses the shared 3pandalabs-postgres instance
# on the Hetzner box (see infra/coolify-setup.md) — nothing here is deployed.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: evitevault
      POSTGRES_PASSWORD: evitevault
      POSTGRES_DB: evitevault
    ports:
      - "5433:5432"
    volumes:
      - evitevault_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evitevault"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evitevault_pgdata:
